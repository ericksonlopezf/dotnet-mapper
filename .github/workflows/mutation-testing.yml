name: Mutation Testing (Stryker)

# ─── Purpose ─────────────────────────────────────────────────────────────────
# Runs Stryker.NET mutation testing across all EricksonLopez.Mapper packages:
#   • Core Library (EricksonLopez.Mapper)
#   • Abstractions (EricksonLopez.Mapper.Abstractions)
#   • Analyzers (EricksonLopez.Mapper.Analyzers)
#   • DomainPrimitives (EricksonLopez.Mapper.DomainPrimitives)
#   • Generator (EricksonLopez.Mapper.Generator)
#   • Mapster Bridge (EricksonLopez.Mapper.Mapster)
#   • Result Integration (EricksonLopez.Mapper.Result)
#
# Threshold policy (single source of truth defined in stryker-*.json):
#   • high  (≥100%) — ✅ HIGH
#   • low   (≥ 98%) — 🟡 LOW
#   • warn  (≥ 95%) — 🟠 WARNING (approaching break threshold)
#   • break (< 95%) — ❌ FAILED (Stryker exits with non-zero code)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mutation-level:
        description: "Stryker mutation level (Basic, Standard, Advanced)"
        required: false
        default: "Standard"
        type: choice
        options:
          - Basic
          - Standard
          - Advanced
  # Weekly scheduled execution (Monday 04:00 UTC) to catch regressions early
  workflow_call:
    inputs:
      mutation-level:
        description: "Stryker mutation level (Basic, Standard, Advanced)"
        required: false
        default: "Standard"
        type: string
  # Weekly scheduled execution
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  mutation-test:
    name: Stryker — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            config: stryker-config.json
            output-dir: StrykerOutput/core
            artifact-name: stryker-report-core
          - name: Abstractions
            config: stryker-abstractions-config.json
            output-dir: StrykerOutput/abstractions
            artifact-name: stryker-report-abstractions
          - name: Analyzers
            config: stryker-analyzers-config.json
            output-dir: StrykerOutput/analyzers
            artifact-name: stryker-report-analyzers
          - name: DomainPrimitives
            config: stryker-domainprimitives-config.json
            output-dir: StrykerOutput/domainprimitives
            artifact-name: stryker-report-domainprimitives
          - name: Generator
            config: stryker-generator-config.json
            output-dir: StrykerOutput/generator
            artifact-name: stryker-report-generator
          - name: Mapster
            config: stryker-mapster-config.json
            output-dir: StrykerOutput/mapster
            artifact-name: stryker-report-mapster
          - name: Result
            config: stryker-result-config.json
            output-dir: StrykerOutput/result
            artifact-name: stryker-report-result

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Mapper.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Mapper.slnx --no-restore --configuration Release

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Stryker (${{ matrix.name }})
        id: stryker
        run: |
          set +e
          dotnet stryker \
            --config-file ${{ matrix.config }} \
            --test-runner vstest \
            --mutation-level ${{ inputs.mutation-level || 'Standard' }} \
            --output ${{ matrix.output-dir }}
          STRYKER_EXIT_CODE=$?
          echo "exit_code=$STRYKER_EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Stryker finished with exit code: $STRYKER_EXIT_CODE"
          exit 0

      - name: Upload Stryker report (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact-name }}-${{ github.run_id }}
          path: ${{ matrix.output-dir }}/
          retention-days: 30

      # ─── Extract and report mutation score ───────────────────────────────
      - name: Extract and report mutation score (${{ matrix.name }})
        id: report
        if: always()
        run: node scripts/record-stryker-result.js "${{ matrix.output-dir }}" "${{ matrix.name }}" "${{ matrix.config }}"

      - name: Upload summary JSON (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stryker-summary-${{ matrix.name }}
          path: StrykerOutput/summary-${{ matrix.name }}.json
          retention-days: 30

  # ─── Consolidated Gate Aggregation & Commit Status ───────────────────────────
  mutation-gate-summary:
    name: Consolidated Quality Gate & Commit Status
    runs-on: ubuntu-latest
    needs: mutation-test
    if: always()
    permissions:
      contents: read
      statuses: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all summary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stryker-summary-*
          path: ./all-summaries
          merge-multiple: true

      - name: Evaluate Consolidated Mutation Quality Gate
        id: eval-gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const summariesDir = path.join(process.cwd(), 'all-summaries');
            function findSummaryFiles(dir) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  results = results.concat(findSummaryFiles(fullPath));
                } else if (entry.isFile() && entry.name.startsWith('summary-') && entry.name.endsWith('.json')) {
                  results.push(fullPath);
                }
              }
              return results;
            }

            const summaryFiles = findSummaryFiles(summariesDir);

            console.log(`Found ${summaryFiles.length} summary files in ${summariesDir}`);

            const expectedPackages = ['Core', 'Abstractions', 'Analyzers', 'DomainPrimitives', 'Generator', 'Mapster', 'Result'];
            const packages = [];
            let totalKilled = 0;
            let totalMutants = 0;
            let allPassed = summaryFiles.length >= expectedPackages.length;

            for (const file of summaryFiles) {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                packages.push(data);
                totalKilled += data.mutants_killed || data.killed || 0;
                totalMutants += data.total_mutants || data.total || 0;
                if (!data.passed_break && !data.passed) {
                  allPassed = false;
                }
              } catch (e) {
                console.error(`Error reading ${file}:`, e.message);
                allPassed = false;
              }
            }

            const overallScore = totalMutants > 0 ? ((totalKilled / totalMutants) * 100).toFixed(2) : (packages.length > 0 ? "100.00" : "0.00");
            const numScore = parseFloat(overallScore);

            let statusLabel = '❌ FAILED';
            if (allPassed) {
              const allHigh = packages.every(p => (p.status || '').includes('HIGH'));
              const allLowOrHigh = packages.every(p => (p.status || '').includes('HIGH') || (p.status || '').includes('LOW'));
              if (allHigh || numScore >= 100) {
                statusLabel = '✅ HIGH';
              } else if (allLowOrHigh || numScore >= 98) {
                statusLabel = '🟡 LOW';
              } else {
                statusLabel = '🟠 WARNING';
              }
            } else {
              statusLabel = '❌ FAILED';
            }

            console.log(`Consolidated Score: ${overallScore}%`);
            console.log(`Overall Status   : ${statusLabel}`);
            console.log(`Passed Gate      : ${allPassed}`);

            const targetSha = context.sha;
            const execDate = new Date().toISOString();
            let md = `\n# 🛡️ Consolidated Stryker Mutation Testing Gate\n\n`;
            md += `| Metric | Value |\n`;
            md += `|--------|-------|\n`;
            md += `| **Mutation Score** | **${overallScore}%** |\n`;
            md += `| **Mutants Killed** | ${totalKilled} |\n`;
            md += `| **Total Mutants** | ${totalMutants} |\n`;
            md += `| **Status** | ${statusLabel} |\n`;
            md += `| **Commit SHA** | \`${targetSha.substring(0, 7)}\` ( \`${targetSha}\` ) |\n`;
            md += `| **Execution date** | ${execDate} |\n\n`;
            md += `### Package Breakdown\n\n`;
            md += `| Package | Score | Killed / Total | Break Threshold | Status |\n`;
            md += `|---------|-------|----------------|-----------------|--------|\n`;
            for (const p of packages) {
              md += `| **${p.package}** | **${p.mutation_score !== undefined ? p.mutation_score : p.score}%** | ${p.mutants_killed || p.killed || 0}/${p.total_mutants || p.total || 0} | ≥${p.threshold_break || p.break || 95}% | ${p.status} |\n`;
            }
            md += `| **OVERALL** | **${overallScore}%** | **${totalKilled}/${totalMutants}** | *Per-Package* | **${statusLabel}** |\n\n`;
            md += `**Gate Verdict**: ${allPassed ? '✅ PASSED' : '❌ FAILED'}\n`;

            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && fs.existsSync(path.dirname(summaryPath))) {
              fs.appendFileSync(summaryPath, md, 'utf8');
            }

            // Post GitHub Commit Status
            const state = allPassed ? 'success' : 'failure';
            const passedCount = packages.filter(p => p.passed_break || p.passed).length;
            const description = `Score: ${overallScore}% (${passedCount}/${packages.length} packages passed) - ${statusLabel}`;

            console.log(`Publishing commit status for ${targetSha}: state=${state}, description="${description}"`);

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: targetSha,
                state: state,
                context: 'mutation-testing/stryker',
                description: description.substring(0, 140),
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              console.log('✅ Successfully created commit status mutation-testing/stryker');
            } catch (err) {
              console.error('⚠️ Failed to create commit status:', err.message);
            }

            if (!allPassed) {
              core.setFailed(`Consolidated Stryker Mutation Testing Gate failed: score=${overallScore}%, passed=${allPassed}`);
            }